<head>

<title>ستریکەکانم</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ستریکەکانم">

<style>
  :root {
    --bg: #07070a;
    --row: #101015;
    --line: #23232b;
    --text: #f4f4f6;
    --muted: #8d8d99;
    --fire: #ff7a1a;
    --snap: #fffc00;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 16px;
    position: sticky; top: 0; z-index: 5;
    background: rgba(7,7,10,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .me { display: flex; align-items: center; gap: 10px; }
  .me-name { font-size: 18px; font-weight: 700; direction: ltr; unicode-bidi: isolate; }
  .socials { display: flex; gap: 8px; }
  .socials a {
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--row); border: 1px solid var(--line);
  }
  .socials a:focus-visible, .count:focus-visible { outline: 2px solid var(--snap); outline-offset: 2px; }
  .socials svg { width: 20px; height: 20px; }
  .total { padding: 14px 16px 6px; color: var(--muted); font-size: 14px; }
  .total b { color: var(--text); }

  ul { list-style: none; padding: 0; max-width: 640px; margin: 0 auto; }
  li {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .av { position: relative; width: 58px; height: 58px; flex: none; }
  .av .pic {
    width: 100%; height: 100%; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 24px; font-weight: 700; color: #fff;
    overflow: hidden;
  }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .av .emo {
    position: absolute; bottom: -4px; inset-inline-end: -4px;
    width: 26px; height: 26px; border-radius: 50%;
    background: #1a1a20; border: 2px solid var(--bg);
    display: grid; place-items: center; font-size: 14px;
  }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .name svg { width: 16px; height: 16px; flex: none; }
  .note { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .count {
    flex: none; display: flex; align-items: center; gap: 4px;
    background: var(--row); border: 1px solid var(--line);
    color: var(--text); font: inherit; font-size: 18px; font-weight: 700;
    padding: 8px 12px; border-radius: 14px; cursor: pointer;
    direction: ltr;
  }
  .count:active { transform: scale(.96); }

  /* Details sheet */
  .shade {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .shade.open { display: flex; }
  .sheet {
    width: 100%; max-width: 480px; background: #14141a;
    border-radius: 24px 24px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    border: 1px solid var(--line); border-bottom: 0;
    animation: up .22s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet h2 { font-size: 20px; margin-bottom: 4px; }
  .sheet .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { background: var(--row); border: 1px solid var(--line); border-radius: 16px; padding: 14px 8px; text-align: center; }
  .cell .n { font-size: 30px; font-weight: 800; color: var(--fire); }
  .cell .l { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .close {
    margin-top: 16px; width: 100%; padding: 12px; border-radius: 14px;
    border: 0; background: var(--snap); color: #000; font: inherit; font-weight: 700; cursor: pointer;
  }
</style>
</head>

  // ====== التحديث التلقائي ======
  // BASE_DATE = اليوم الي الأرقام فوق صحيحة بيه (سنة-شهر-يوم).
  // RESET_HOUR = الساعة الي يزيد بيها الرقم: 0 = 12 بالليل، 12 = 12 الظهر.
  // stopped = (اختياري) تاريخ انقطع بي الستريك، مثلاً stopped: "2026-11-03" يوقف الزيادة.
  const BASE_DATE = "2026-10-25";
  const RESET_HOUR = 0;
  // ==============================

  const YEAR = 365, MONTH = 30;

  // کوردی: دوای ژمارە وشەکە تاک دەمێنێتەوە (٥ ساڵ، ١٢ ڕۆژ)
  function unit(n, one, two, word) {
    if (n === 1) return one;
    if (n === 2) return two;
    return n + " " + word;
  }
  const yTxt = n => unit(n, "ساڵێک", "دوو ساڵ", "ساڵ");
  const mTxt = n => unit(n, "مانگێک", "دوو مانگ", "مانگ");
  const dTxt = n => unit(n, "ڕۆژێک", "دوو ڕۆژ", "ڕۆژ");

  function split(d) {
    const y = Math.floor(d / YEAR);
    const rest = d - y * YEAR;
    const m = Math.floor(rest / MONTH);
    const days = rest - m * MONTH;
    return { y, m, days, rest };
  }

  // تێبینی لە ژێر ناو: ساڵێک و 15 ڕۆژ / دوو ساڵ و 10 ڕۆژ
  function note(d) {
    const { y, m, days, rest } = split(d);
    if (y > 0) {
      return rest ? yTxt(y) + " و " + dTxt(rest) : yTxt(y);
    }
    if (m > 0) {
      return days ? mTxt(m) + " و " + dTxt(days) : mTxt(m);
    }
    return dTxt(d);
  }

  function colorFor(s) {
    let h = 0;
    for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360;
    return "hsl(" + h + " 45% 38%)";
  }

  const list = document.getElementById("list");

  function dayNum(y, m, d) { return Math.round(Date.UTC(y, m, d) / 864e5); }
  const [BY, BM, BD] = BASE_DATE.split("-").map(Number);
  const BASE_NUM = dayNum(BY, BM - 1, BD);

  // كم يوم مرّ من BASE_DATE (يزيد عند RESET_HOUR كل يوم)
  function elapsedDays() {
    const t = new Date(Date.now() - RESET_HOUR * 3600000);
    return Math.max(0, dayNum(t.getFullYear(), t.getMonth(), t.getDate()) - BASE_NUM);
  }

  function currentStreak(f) {
    let n = elapsedDays();
    if (f.stopped) {
      const [y, m, d] = f.stopped.split("-").map(Number);
      n = Math.min(n, Math.max(0, dayNum(y, m - 1, d) - BASE_NUM));
    }
    return f.streak + n;
  }

  function checkDay() {
    const n = elapsedDays();
    if (n !== lastN) { lastN = n; render(); }
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", checkDay);

  const shade = document.getElementById("shade");
  function openSheet(f) {
    const { y, m, days } = split(f.streak);
    document.getElementById("sheetTitle").textContent = f.name;
    document.getElementById("sheetSub").textContent = "🔥 " + f.streak + " ڕۆژ ستریک";
    document.getElementById("dY").textContent = y;
    document.getElementById("dM").textContent = m;
    document.getElementById("dD").textContent = days;
    shade.classList.add("open");
    document.getElementById("closeBtn").focus();
  }
  function closeSheet() { shade.classList.remove("open"); }
  document.getElementById("closeBtn").addEventListener("click", closeSheet);
  shade.addEventListener("click", e => { if (e.target === shade) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
</script>
<script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
